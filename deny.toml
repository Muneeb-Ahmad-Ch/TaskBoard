# cargo-deny: dependency advisories, licenses and sources (SPEC §2, run in CI).
# Run locally with `cargo deny check`.

[graph]
# Taskboard ships for Windows only; Linux/macOS-only crates (GTK, …) are not built.
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Fail on vulnerabilities; unmaintained crates in the Windows build fail too.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
# Permissive licenses only for third-party code.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MPL-2.0",
]

[licenses.private]
# Our own crates (PolyForm Noncommercial) are not published to crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
