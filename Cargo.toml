[workspace]
resolver = "3"
members = ["crates/taskboard-core", "crates/taskboard-cli", "crates/taskboard-mcp", "apps/taskboard-app/src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# No panics in production paths (SPEC §7). Tests opt out with #[allow] at module level.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"
strip = "symbols"
