name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/taskboard-app/ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: apps/taskboard-app/ui
        run: pnpm install --frozen-lockfile

      # Builds NSIS + MSI and attaches them to a draft release for review.
      # Signing / updater secrets are optional; see docs/RELEASING.md.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The action looks for tauri.conf.json inside projectPath, so point it
          # at the app folder (holds src-tauri/) and run the UI's tauri script.
          projectPath: apps/taskboard-app
          tauriScript: pnpm -C ui tauri
          tagName: ${{ github.ref_name }}
          releaseName: Taskboard ${{ github.ref_name }}
          releaseBody: |
            What's new: see the [changelog](https://github.com/Muneeb-Ahmad-Ch/TaskBoard/blob/main/CHANGELOG.md).

            Download `Taskboard_*_x64-setup.exe` below. Installers are not code-signed yet, so Windows may show "Windows protected your PC": click More info → Run anyway.
          releaseDraft: true
          prerelease: false
