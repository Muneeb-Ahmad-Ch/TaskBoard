[package]
name = "taskboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
csv = "1.4.0"
jiff = "0.2.38"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rusqlite_migration = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true
