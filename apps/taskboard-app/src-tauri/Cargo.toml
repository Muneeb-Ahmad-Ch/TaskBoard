[package]
name = "taskboard-app"
version.workspace = true
description = "Taskboard desktop app"
authors = ["Muneeb Ahmad"]
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "taskboard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = ["tray-icon"] }
taskboard-core = { version = "0.5.0", path = "../../../crates/taskboard-core" }
taskboard-mcp = { version = "0.5.0", path = "../../../crates/taskboard-mcp" }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
window-vibrancy = "0.8.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-global-shortcut = "2.4.1"
jiff = "0.2.38"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tracing-appender = "0.2.5"
# Updates are plain installers (no zip), fetched with Windows' own TLS.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["native-tls", "system-proxy"] }

[lints]
workspace = true
